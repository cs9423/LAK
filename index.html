<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>荔景站 4月台完美全螢幕版</title>
<style>
  /* 使用 dvh (Dynamic Viewport Height) 自動適應有冇網址 bar 嘅情況 */
  html, body {
    background-color: #000000; 
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 6px;
    height: 100dvh; 
    width: 100vw;
    box-sizing: border-box;
    overflow: hidden; /* 徹底鎖死捲動條 */
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* 頂部時鐘欄 */
  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 10dvh;
    border-bottom: 1px solid #222222;
    padding: 0 10px;
  }
  .header-title {
    font-size: 1.3em;
    color: #ffffff;
    font-weight: bold;
  }
  .fullscreen-hint {
    font-size: 0.5em;
    color: #555555;
    margin-left: 5px;
  }
  .realtime-clock {
    font-size: 1.6em;
    font-weight: bold;
    color: #00A650;
  }

  /* 核心四格排版 */
  .container {
    display: grid;
    gap: 6px;
    height: 87dvh;
    margin-top: 4px;
    box-sizing: border-box;
  }

  /* 📱 手機打橫放 (Landscape)：自動變成 2x2 四格 */
  @media (orientation: landscape) {
    .container {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
  }

  /* 📱 手機打直放 (Portrait)：自動變成 1x4 四行 */
  @media (orientation: portrait) {
    .container {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, 1fr);
    }
  }

  .direction {
    border: 2px solid #333333;
    border-radius: 8px;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    overflow: hidden;
  }

  .dest-title {
    font-size: 1.2em;
    font-weight: bold;
    text-align: center;
    margin: 0;
    padding-bottom: 2px;
    border-bottom: 1px solid #222222;
  }

  .train-list {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    gap: 2px;
  }

  .train {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 45%;
  }

  .train-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .platform {
    font-size: 0.7em;
    color: #eeeeee;
    background-color: #111111;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .arrival-time {
    font-size: 0.8em;
    color: #888888;
  }

  .time {
    font-size: 1.5em;
    font-weight: bold;
  }

  .min {
    font-size: 0.5em;
    color: #888888;
  }

  .arriving {
    color: #FF3B30; 
    animation: blink 1.5s infinite; 
  }

  @keyframes blink {
    50% { opacity: 0.4; }
  }

  .update-time {
    position: absolute;
    bottom: 2px;
    right: 10px;
    color: #333333;
    font-size: 0.6em;
  }
</style>
</head>
<body>

<div class="header-container">
  <div class="header-title">荔景 (LAK) <span class="fullscreen-hint">[點擊畫面全螢幕]</span></div>
  <div class="realtime-clock" id="currentClock">--:--:--</div>
</div>

<div class="container">
  <div class="direction" style="border-color: #E2231A;">
    <div class="dest-title" id="twl-up-dest" style="color: #E2231A;">荃灣綫 往荃灣</div>
    <div class="train-list" id="twl-up-trains"></div>
  </div>
  
  <div class="direction" style="border-color: #E2231A;">
    <div class="dest-title" id="twl-down-dest" style="color: #E2231A;">荃灣綫 往中環</div>
    <div class="train-list" id="twl-down-trains"></div>
  </div>

  <div class="direction" style="border-color: #F6903D;">
    <div class="dest-title" id="tcl-up-dest" style="color: #F6903D;">東涌綫 往東涌</div>
    <div class="train-list" id="tcl-up-trains"></div>
  </div>

  <div class="direction" style="border-color: #F6903D;">
    <div class="dest-title" id="tcl-down-dest" style="color: #F6903D;">東涌綫 往香港</div>
    <div class="train-list" id="tcl-down-trains"></div>
  </div>
</div>

<div class="update-time" id="lastUpdate">最後更新: ---</div>

<script>
  const destMap = { 'TWH': '荃灣', 'CEN': '中環', 'TUC': '東涌', 'HOK': '香港', 'TSY': '青衣', 'ADM': '金鐘', 'LAK': '荔景' };

  // 💡 新增功能：手指點擊畫面任何地方，即自動進入/退出全螢幕，隱藏網址 bar
  document.body.addEventListener('click', function() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log(`全螢幕失敗: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  });

  function updateClock() {
    const now = new Date();
    document.getElementById('currentClock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  async function fetchMTRData() {
    try {
      const [twlRes, tclRes] = await Promise.all([
        fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TWL&sta=LAK').catch(()=>null),
        fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TCL&sta=LAK').catch(()=>null)
      ]);

      if (twlRes) {
        const twlJson = await twlRes.json();
        if (twlJson.status === 1) {
          const data = twlJson.data['TWL-LAK'];
          renderTrains('twl-up-trains', 'twl-up-dest', '荃灣綫', '荃灣', data?.UP, '#E2231A');
          renderTrains('twl-down-trains', 'twl-down-dest', '荃灣綫', '中環', data?.DOWN, '#E2231A');
        }
      }

      if (tclRes) {
        const tclJson = await tclRes.json();
        if (tclJson.status === 1) {
          const data = tclJson.data['TCL-LAK'];
          renderTrains('tcl-up-trains', 'tcl-up-dest', '東涌綫', '東涌', data?.UP, '#F6903D');
          renderTrains('tcl-down-trains', 'tcl-down-dest', '東涌綫', '香港', data?.DOWN, '#F6903D');
        }
      }
      
      const now = new Date();
      document.getElementById('lastUpdate').innerText = `更新: ${now.toLocaleTimeString('en-US', { hour12: false })}`;
    } catch (error) {
      document.getElementById('lastUpdate').innerText = '連線錯誤...';
    }
  }

  function renderTrains(containerId, destId, lineName, defaultDest, trains, color) {
    const container = document.getElementById(containerId);
    const titleEl = document.getElementById(destId);
    
    if (!trains || trains.length === 0) {
      container.innerHTML = '<div class="train" style="font-size:0.9em; color:#444; justify-content:center;">已收車 / 沒班次</div>';
      titleEl.innerText = `${lineName} 往${defaultDest}`;
      return;
    }

    const destCode = trains[0].dest;
    titleEl.innerText = `${lineName} 往${destMap[destCode] || destCode}`;
    container.innerHTML = ''; 
    
    trains.slice(0, 2).forEach(train => {
      let ttbStr = train.ttb;
      let ttb = parseInt(ttbStr);
      let exactTimeText = "--:--";
      
      if (train.time && train.time.includes(" ")) {
        exactTimeText = train.time.split(" ")[1].substring(0, 5);
      }

      if (isNaN(ttb)) {
        if (train.time && train.time !== "0" && train.time !== "-") {
          let targetDate = new Date(train.time.replace(/-/g, '/')); 
          let diffMins = Math.floor((targetDate - new Date()) / 60000);
          ttb = diffMins > 0 ? diffMins : 0;
        } else { ttb = 0; }
      }
      
      let timeText = '';
      let timeClass = 'time';
      
      if (ttb <= 1 || train.time === "0" || ttbStr === "") {
        timeText = (ttb === 0 || train.time === "0") ? '進站中' : '即將到';
        timeClass = 'time arriving';
        exactTimeText = "NOW"; 
      } else {
        timeText = ttb + '<span class="min"> 分鐘</span>';
      }
      
      let platStr = train.plat ? `月台 ${train.plat}` : '??';
      
      container.innerHTML += `
        <div class="train">
          <div class="train-left">
            <div class="platform" style="border: 1px solid ${color}">${platStr}</div>
            <div class="arrival-time">${exactTimeText}</div>
          </div>
          <div class="${timeClass}">${timeText}</div>
        </div>
      `;
    });
  }

  fetchMTRData();
  setInterval(fetchMTRData, 20000);
</script>
</body>
</html>
